<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail · popity.ro</title>
  <meta name="description" content="Send Sebastian Popity a message.">
  <link rel="canonical" href="https://popity.ro/mail/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/roboto-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/contact.js" defer></script>
</head>
<body>
  <main class="term">
    <nav aria-label="Main">
      <p class="cmd"><span class="ps1">seba@popity:~$</span>ls</p>
      <ul class="nav">
        <li><a href="/">home</a></li>
        <li><a href="/about/">about</a></li>
        <li><a href="/blog/">blog</a></li>
        <li><a href="/mail/" aria-current="page">mail</a></li>
      </ul>
    </nav>

    <p class="cmd"><span class="ps1">seba@popity:~$</span>mail seba</p>
    <form class="out mailform" id="mailform" action="/mail/send.php" method="post" novalidate>
      <div class="field">
        <label for="from">From:</label>
        <input id="from" name="from" type="email" autocomplete="email" maxlength="254" required spellcheck="false" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="subject">Subject:</label>
        <input id="subject" name="subject" type="text" maxlength="150" required>
      </div>
      <div class="field field-msg">
        <label for="message" class="dim">Message (5000 chars max):</label>
        <textarea id="message" name="message" rows="8" maxlength="5000" required></textarea>
      </div>
      <!-- spam traps: real visitors never fill these -->
      <div class="trap" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <input type="hidden" name="elapsed" id="elapsed" value="0">

      <p class="dim small">Your email is used only to reply to you. See the <a href="/privacy/">privacy policy</a>.</p>
      <noscript><p class="status err">mail: this form needs JavaScript. Please enable it, or reach me on <a href="https://www.linkedin.com/in/popity/">LinkedIn</a>.</p></noscript>
      <button type="submit" class="send">[ send ]</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="cmd"><span class="ps1">seba@popity:~$</span><a href="/">cd ..</a> <span class="cursor" aria-hidden="true"></span></p>
  </main>

  <footer class="footer">&copy; 2026 popity.ro &middot; <a href="/privacy/">privacy</a></footer>
</body>
</html>
